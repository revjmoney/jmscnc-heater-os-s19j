# Security scanning for the fork.
#
# Blocking: CodeQL analysis uploads results to the Security tab (it does not
# fail the build by itself; review alerts there).
# Advisory (continue-on-error) until the inherited upstream code is triaged:
# cargo-deny (RustSec advisories, licenses, bans, sources via deny.toml),
# npm audit, gitleaks over full history, and ShellCheck (errors only).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"

  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          manifest-path: DCENT_OS_Antminer/dcentrald/Cargo.toml
          # Default features = what the firmware ships. The optional mqtt-tls
          # feature's rumqttc TLS stack (old rustls-webpki, rustls-pemfile) is
          # compiled out; upstream reviews it in scripts/daemon_supply_chain.py.
          command: check

  npm-audit:
    name: npm audit · dashboard
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: DCENT_OS_Antminer/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high --omit=dev

  gitleaks:
    name: gitleaks · secrets in history
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck · scripts (errors only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # SC2148: dotfiles like .profile/.bashrc have no shebang by design.
          SHELLCHECK_OPTS: -e SC2148
        with:
          severity: error
          scandir: DCENT_OS_Antminer
